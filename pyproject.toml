#Project metadata and Python dependencies for the SEC Financial Intelligence platform.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-financial-intelligence"
version = "0.1.0"
description = "Structured financial analytics and source-grounded SEC filing research."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rank-bm25>=0.2.2",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "streamlit>=1.38",
  "tenacity>=8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]
ollama = ["ollama>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
